name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the pinned tokenizer
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tokenizer.json" \
            "https://huggingface.co/FluidInference/embeddinggemma-2-coreml/resolve/3f978ddf92cac9aa07eb2dcf6eb36cf450f3dba4/tokenizer.json"
          printf '%s  %s\n' 4d777ef5bdc1aa36227abdfb77c3e49e7b9c892d16e1b6bda41c393504828be4 "$RUNNER_TEMP/tokenizer.json" | shasum -a 256 --check
      - name: Build and run unit tests
        env:
          TEST_RUNNER_LODGE_TOKENIZER: ${{ runner.temp }}/tokenizer.json
          TEST_RUNNER_LODGE_REQUIRE_TOKENIZER: "1"
        run: >-
          xcodebuild -project Lodge.xcodeproj -scheme Lodge
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/LodgeBuild"
          -resultBundlePath "$RUNNER_TEMP/LodgeTests.xcresult"
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO test
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/LodgeTests.xcresult
