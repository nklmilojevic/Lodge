name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.7.0)"
        required: true
      existing_tag:
        description: "Build an existing tag without changing its version"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.existing_tag && format('refs/tags/{0}', inputs.tag) || 'main') || github.ref }}

      - name: Install Sparkle tools
        env:
          SPARKLE_VERSION: "2.9.2"
          SPARKLE_SHA256: "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95"
        run: |
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          SPARKLE_DIRECTORY="$RUNNER_TEMP/SparkleTools"
          curl --fail --location --retry 3 \
            --output "$SPARKLE_ARCHIVE" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          printf '%s  %s\n' "$SPARKLE_SHA256" "$SPARKLE_ARCHIVE" | shasum -a 256 --check
          mkdir -p "$SPARKLE_DIRECTORY"
          tar -xf "$SPARKLE_ARCHIVE" -C "$SPARKLE_DIRECTORY"
          "$SPARKLE_DIRECTORY/bin/generate_appcast" --help > /dev/null
          echo "SPARKLE_BIN=$SPARKLE_DIRECTORY/bin" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: >-
          xcodebuild -quiet -project Lodge.xcodeproj -scheme Lodge
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/LodgeTests"
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO test

      - name: Commit and tag release version
        if: github.event_name == 'workflow_dispatch' && !inputs.existing_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --tags
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          CURRENT_BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' Lodge.xcodeproj/project.pbxproj | sed 's/[^0-9]//g')
          NEW_BUILD=$((CURRENT_BUILD + 1))
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $VERSION;/g" Lodge.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" Lodge.xcodeproj/project.pbxproj

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Lodge.xcodeproj/project.pbxproj
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"

      - name: Verify committed release version
        run: |
          VERSION="${RELEASE_TAG#v}"
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "Tag $RELEASE_TAG does not point at the checked-out release commit"
            exit 1
          fi

          PROJECT_VERSIONS=$(grep 'MARKETING_VERSION' Lodge.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);/\1/' | sort -u)
          if [[ "$PROJECT_VERSIONS" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match committed project version(s): $PROJECT_VERSIONS"
            exit 1
          fi

          git diff --exit-code

      - name: Import signing certificates
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization key
        run: |
          echo "${{ secrets.NOTARY_KEY_P8 }}" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - name: Update export options team ID
        run: /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" scripts/export-options.plist

      - name: Build, sign, and notarize
        run: |
          chmod +x scripts/release.sh scripts/generate-appcast.sh
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8" \
          NOTARY_KEY_ID="${{ secrets.NOTARY_KEY_ID }}" \
          NOTARY_ISSUER_ID="${{ secrets.NOTARY_ISSUER_ID }}" \
          scripts/release.sh

      - name: Prepare Sparkle private key
        run: |
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" | base64 -d > "$RUNNER_TEMP/sparkle_ed_private"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_private"

      - name: Generate appcast
        run: |
          SPARKLE_PRIVATE_KEY="$RUNNER_TEMP/sparkle_ed_private" \
            DOWNLOAD_URL_PREFIX="$DOWNLOAD_URL_PREFIX" \
            scripts/generate-appcast.sh

      - name: Commit appcast to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update appcast for $RELEASE_TAG"
            git push origin main
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            build/Lodge.dmg \
            build/updates/Lodge.app.zip \
            appcast.xml \
            --clobber

      - name: Update Homebrew tap
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SHA256=$(shasum -a 256 build/updates/Lodge.app.zip | awk '{print $1}')

          gh repo clone nklmilojevic/homebrew-lodge "$RUNNER_TEMP/homebrew-lodge"
          cd "$RUNNER_TEMP/homebrew-lodge"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/nklmilojevic/homebrew-lodge.git"

          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/lodge.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/lodge.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lodge.rb
          git commit -m "Update Lodge to $VERSION"
          git push
